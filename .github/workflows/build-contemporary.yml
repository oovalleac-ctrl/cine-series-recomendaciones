name: Build contemporary movie catalogue

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/contemporary-trigger.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check TMDb token
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: |
          if [ -z "$TMDB_API_TOKEN" ]; then
            echo "Configure TMDB_API_TOKEN first."
            exit 1
          fi

      - name: Build contemporary catalogue
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: python scripts/build_contemporary.py

      - name: Commit catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contemporary.js
          if git diff --cached --quiet; then
            echo "No catalogue changes"
            exit 0
          fi
          git commit -m "Build contemporary movie catalogue"
          git push
