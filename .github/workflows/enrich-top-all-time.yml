name: Enrich all-time selection with TMDb

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/top-all-time-enrich-trigger.txt"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check TMDb token
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: |
          if [ -z "$TMDB_API_TOKEN" ]; then
            echo "Configure TMDB_API_TOKEN first."
            exit 1
          fi

      - name: Enrich top 200
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: python scripts/enrich_top_all_time.py

      - name: Commit metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/top-all-time.js
          if git diff --cached --quiet; then
            echo "No metadata changes"
            exit 0
          fi
          git commit -m "Enrich all-time selection with TMDb"
          git push
