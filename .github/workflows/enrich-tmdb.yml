name: Enrich watchlist with TMDb

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/tmdb-enrich-trigger.txt"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check TMDb token
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: |
          if [ -z "$TMDB_API_TOKEN" ]; then
            echo "Configure the repository secret TMDB_API_TOKEN first."
            exit 1
          fi

      - name: Enrich catalogue
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: python scripts/enrich_tmdb.py

      - name: Commit metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/watchlist.js data/watchlist_unmatched.json
          if git diff --cached --quiet; then
            echo "No metadata changes"
            exit 0
          fi
          git commit -m "Enrich personal watchlist with TMDb"
          git push
